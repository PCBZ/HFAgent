name: CD

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run-agent:
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m venv .venv
          source .venv/bin/activate
          pip install -r requirement.txt

      # - name: Run Dummy Agent
      #   env:
      #     GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      #   run: .venv/bin/python dummy_agent.py

      - name: Run Smolagents Demo
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: .venv/bin/python smolagents_demo.py